plugins {
    id 'com.android.application'
}

android {
    namespace = 'moe.cyunrei.videolivewallpaper'
    // API 37 ships as the minor-versioned SDK platform "android-37.0" and
    // requires AGP 9.1.1 or newer.
    compileSdk = 37

    defaultConfig {
        applicationId = "moe.cyunrei.videolivewallpaper"
        minSdk = 24
        targetSdk = 37
        versionCode = 2
        versionName = "0.1.4.5-nano"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
}
